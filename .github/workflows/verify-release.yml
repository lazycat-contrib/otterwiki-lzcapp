name: Verify OtterWiki Release on GitHub
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify
        required: false
        default: v2.26.2
permissions:
  contents: read
concurrency:
  group: otterwiki-release-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="$(gh release view --json tagName --jq .tagName)"; fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Download exact Release asset on runner
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ASSET_NAME="community.lazycat.app.otterwiki-${RELEASE_TAG}.lpk"
          echo "ASSET_NAME=$ASSET_NAME" >> "$GITHUB_ENV"
          gh release view "$RELEASE_TAG" --json tagName,assets > release-metadata.json
          gh release download "$RELEASE_TAG" --pattern "$ASSET_NAME" --dir verify-pkg

      - name: Verify package contents
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, tarfile, yaml

          tag = os.environ['RELEASE_TAG']
          name = os.environ['ASSET_NAME']
          pkg = __import__('pathlib').Path('verify-pkg') / name
          assert pkg.is_file(), pkg

          h = hashlib.sha256()
          with pkg.open('rb') as fh:
              for chunk in iter(lambda: fh.read(1 << 20), b''):
                  h.update(chunk)

          with tarfile.open(pkg, 'r:') as package:
              members = package.getnames()
              for required in ('manifest.yml', 'package.yml', 'content.tar', 'icon.png'):
                  assert required in members, (required, members)

              info = yaml.safe_load(package.extractfile('package.yml').read())
              assert info['package'] == 'community.lazycat.app.otterwiki', info['package']
              assert info['name'] == 'OtterWiki', info['name']
              assert info['version'] == tag.lstrip('v'), (info['version'], tag)
              assert info['license'] == 'MIT', info['license']
              assert info['min_os_version'] == '1.5.0', info['min_os_version']

              raw = package.extractfile('manifest.yml').read().decode()
              m = yaml.safe_load(raw)
              app = m['application']
              assert app['subdomain'] == 'otterwiki', app['subdomain']
              ups = app['upstreams']
              assert any(u['location'] == '/' and 'otterwiki:80' in (u.get('backend') or '')
                         for u in ups), ups

              svcs = m['services']
              assert set(svcs) == {'otterwiki'}, set(svcs)

              svc = svcs['otterwiki']
              assert 'redimp/otterwiki' in svc['image'], svc['image']
              assert svc['image'].endswith(':' + tag.lstrip('v')), svc['image']

              env = ' '.join(str(x) for x in svc['environment'])
              # The upstream default is READ_ACCESS=ANONYMOUS, which publishes the
              # whole wiki to anyone with the URL. All three levels must be raised.
              assert 'READ_ACCESS=REGISTERED' in env, env
              assert 'WRITE_ACCESS=REGISTERED' in env, env
              assert 'ATTACHMENT_ACCESS=REGISTERED' in env, env
              # guard against a future edit putting ANONYMOUS back
              assert 'READ_ACCESS=ANONYMOUS' not in env, 'wiki would be world-readable'
              # AUTH_METHOD is intentionally unset: the default is local accounts,
              # and the proxy-header mode would break local login here.
              assert 'AUTH_METHOD' not in env, env
              # session signing key must come from a stable secret
              assert 'SECRET_KEY=' in env and 'stable_secret' in env, env

              assert any(b.endswith(':/app-data') for b in svc['binds']), svc['binds']

              # account is created by the first visitor registering: no seeded admin
              assert 'deploy_params.yml' not in members, members
              refs = set(re.findall(r'\.U\.([A-Za-z0-9_]+)', raw))
              assert not refs, f'unexpected deploy-param refs: {refs}'

              assert 'healthcheck' not in svc, svc
              assert 'lzc-file-chooser' not in raw
              assert 'usage' in m and str(m['usage']).strip(), 'usage section missing'
              usage_text = str(m['usage'])
              assert ('真机验证' in usage_text or '实机验证' in usage_text), 'usage must state no device test'
              # the operator has to be told the wiki is not world-readable
              assert '注册' in usage_text, 'usage should explain the registration flow'

              with tarfile.open(fileobj=package.extractfile('content.tar')) as content:
                  cmembers = content.getnames()
                  lic = [n for n in cmembers if 'licenses/' in n]
                  assert lic, cmembers
                  main_lic = [n for n in lic if n.endswith('/LICENSE')]
                  target = main_lic[0] if main_lic else lic[0]
                  license_text = content.extractfile(target).read().decode()
                  flat = ' '.join(license_text.split())
                  assert 'Permission is hereby granted' in flat, flat[:160]

          result = {
              'verified': True,
              'tag': tag,
              'sha256': h.hexdigest(),
              'size': pkg.stat().st_size,
              'runtime_tested': False,
              'note': 'access levels raised from ANONYMOUS default to REGISTERED',
          }
          print(json.dumps(result))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('```json\n' + json.dumps(result, indent=2) + '\n```\n')
          PY
